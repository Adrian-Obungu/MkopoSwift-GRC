name: GRC Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify vault integrity
        run: python verify_vault_integrity.py
      - name: Run breach simulation
        run: |
          cd breach_response
          python breach_triage_automation.py sample_access.log
